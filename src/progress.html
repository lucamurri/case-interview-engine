<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My progress — Case Interview Engine</title>
  <meta name="description" content="Your case scores and drill results, saved only in your browser. Export them any time.">
  <script>try{var t=localStorage.getItem('cie.theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <!-- @header -->

  <main id="main" class="wrap wrap-medium">
    <h1>My progress</h1>
    <p class="lede">Your scores are saved only in this browser — no account needed. Export them to keep a backup or move to another device.</p>

    <div data-progress-root>
      <p class="loading">Loading…</p>
    </div>

    <section class="panel" aria-labelledby="h-data">
      <h2 id="h-data">Your data</h2>
      <p>Download everything as a file you own. Importing a file adds its entries to what's already here (duplicates are skipped).</p>
      <div class="button-row">
        <button class="button" type="button" data-export-json>Export my progress (JSON)</button>
        <button class="button button-outline" type="button" data-export-csv="attempts">Case scores (CSV)</button>
        <button class="button button-outline" type="button" data-export-csv="drills">Drill results (CSV)</button>
      </div>
      <div class="button-row">
        <label class="button button-quiet file-button">
          Import a JSON export
          <input type="file" accept="application/json,.json" data-import class="visually-hidden">
        </label>
        <button class="button button-quiet danger" type="button" data-reset-progress>Delete all progress</button>
      </div>
      <p class="save-result" data-data-status role="status"></p>
    </section>
  </main>

  <!-- @footer -->
  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/progress.js"></script>
</body>
</html>
